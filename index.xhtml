<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN" xml:lang="zh-CN">
<head>
<title>千面 · 客户消费数据智能分群平台</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='44' y2='44'%3E%3Cstop offset='0' stop-color='%23EBD9AC'/%3E%3Cstop offset='1' stop-color='%23B8914F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='44' height='44' rx='9' fill='%230A0E18'/%3E%3Cpath d='M22 6 L36 17.5 L22 38 L8 17.5 Z' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3Cpath d='M8 17.5 H36 M15 17.5 L22 6 M29 17.5 L22 6 M15 17.5 L22 38 M29 17.5 L22 38' stroke='url(%23g)' stroke-width='1.2' opacity='.7'/%3E%3C/svg%3E"/>
<style type="text/css">
html,body{margin:0;height:100%;background:#0A0E18;overflow:hidden}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#8A92A5;font:13px "Microsoft YaHei",sans-serif;letter-spacing:4px}
.ring{width:38px;height:38px;border:3px solid rgba(201,168,106,.18);border-top-color:#C9A86A;border-radius:50%;animation:sp .85s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app{width:100vw;height:100vh;border:0;display:block}
</style>
</head>
<body>
<div id="boot"><div class="ring"> </div><div>千面 · 引擎加载中</div></div>
<iframe id="app" title="千面客户分群平台"></iframe>
<script type="text/javascript">
//<![CDATA[
(function(){
  var BASE='https://cdn.jsdelivr.net/gh/guotaiyan96-ops/-@main/';
  var boot=document.getElementById('boot');
  var ifr=document.getElementById('app');
  ifr.style.display='none';
  ifr.addEventListener('load',function(){
    boot.style.display='none';
    ifr.style.display='block';
  });
  fetch(BASE+'app.html',{cache:'no-store'}).then(function(r){return r.text();}).then(function(html){
    html=html.replace(/(src|href)="(?!https?:|data:|#|\/)([^"]+)"/g,function(m,p1,p2){
      if(/\.js($|\?)/.test(p2)&&p2.indexOf('?')<0){p2=p2+'?v=20261012a';}
      return p1+'="'+BASE+p2+'"';
    });
    ifr.setAttribute('srcdoc',html);
  }).catch(function(){
    boot.innerHTML='<div style="color:#E07A5F">加载失败，请刷新页面重试</div>';
  });
})();
//]]>
</script>
</body>
</html>
